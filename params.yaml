# Data Collection Parameters
data_collection:
  # Reddit configuration
  reddit:
    subreddits:
      - movies
      - MovieReviews
      - TrueFilm
      - boxoffice
      - flicks
    limit_per_movie: 1000
    max_comments_per_post: 20
    min_score: 1
    rate_limit_delay: 1  # seconds between requests

  # Kaggle configuration
  kaggle:
    dataset: "lakshmi25npathi/imdb-dataset-of-50k-movie-reviews"
    sample_size: 20000  # How many to use from Kaggle

  # General data collection
  target_total_samples: 50000
  min_review_length: 20
  max_review_length: 5000

  # Movie lists
  positive_movies:
    - "The Shawshank Redemption"
    - "The Dark Knight"
    - "Inception"
    - "Interstellar"
    - "Avengers Endgame"
    - "Spider-Man No Way Home"
    - "Top Gun Maverick"
    - "Everything Everywhere All at Once"

  negative_movies:
    - "Cats 2019"
    - "The Last Airbender"
    - "Dragonball Evolution"
    - "Fantastic Four 2015"
    - "Batman v Superman"
    - "Suicide Squad 2016"
    - "Morbius"
    - "The Flash 2023"

  neutral_movies:
    - "The Last Jedi"
    - "Justice League"
    - "Wonder Woman 1984"
    - "Eternals"
    - "Thor Love and Thunder"
    - "Matrix Resurrections"

# Preprocessing Parameters
preprocessing:
  classification_type: "binary"
  min_length: 20
  max_length: 5000
  remove_stopwords: false
  lowercase: true
  remove_urls: true
  remove_html: true
  remove_special_chars: false  # Keep punctuation for sentiment
  max_features_tfidf: 5000

  # Train/Val/Test split
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15
  random_state: 42
  stratify: true

# Model Training Parameters
model:
  # Traditional ML
  traditional:
    random_state: 42
    test_size: 0.15
    cv_folds: 5

    logistic_regression:
      C: [0.1, 1, 10]
      penalty: ['l1', 'l2']
      solver: ['liblinear', 'saga']
      max_iter: [2000]  # Increased for better convergence with large dataset

    random_forest:
      n_estimators: [100, 200, 300]
      max_depth: [10, 20, 30]  # Removed null to prevent unlimited depth
      min_samples_split: [5, 10, 20]  # Increased minimum samples to split
      min_samples_leaf: [2, 4, 8]  # Increased minimum samples per leaf

    svm:
      # Using RBF kernel only (skip linear - too slow for large dataset)
      C: [0.1, 1, 10, 100]  # 4 values - good range for tuning
      kernel: ['rbf']  # Only RBF kernel (skip linear - too slow)
      gamma: ['scale', 'auto']  # 2 values - both are important for RBF
      # Total: 4 × 1 × 2 = 8 combinations, 8 × 5 = 40 fits
      # Estimated time: ~14 hours with n_jobs=-1

  # Transformer model
  transformer:
    model_name: "distilbert-base-uncased"
    num_labels: 2
    max_length: 512
    epochs: 3
    batch_size: 16
    learning_rate: 0.00002
    warmup_steps: 500
    weight_decay: 0.01
    logging_steps: 100
    eval_strategy: "epoch"
    save_strategy: "epoch"
    load_best_model: true

# Evaluation Parameters
evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc

  # Performance gates
  min_accuracy: 0.85
  min_f1: 0.83
  min_precision: 0.82

# MLflow Parameters
mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "movie_sentiment_analysis"
  artifact_location: "./mlruns"

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  reload: false
  log_level: "info"

  # Model serving
  model:
    name: "distilbert"
    path: "models/distilbert"
    max_length: 512
    batch_size: 16

  # Batch prediction limits
  batch_limits:
    max_texts: 1000
    recommended_texts: 100
    max_batch_size: 32
    default_batch_size: 16

  # Monitoring
  monitoring:
    prometheus_enabled: true
    metrics_endpoint: "/metrics"
    log_requests: true
