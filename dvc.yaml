stages:
  # Stage 1: Data Collection
  data_collection:
    cmd: python src/data_collection/collect_all.py
    deps:
      - src/data_collection/collect_all.py
      - src/data_collection/reddit_collector.py
      - src/data_collection/kaggle_downloader.py
      - src/utils/config.py
      - src/utils/logger.py
      - src/utils/helpers.py
    params:
      - data_collection
    outs:
      - data/raw/reddit_reviews.csv
      - data/raw/kaggle_imdb.csv
      - data/raw/collection_metadata.json
    metrics:
      - data/raw/collection_stats.json:
          cache: false

  # Stage 2: Data Validation
  data_validation:
    cmd: python src/preprocessing/validate_data.py
    deps:
      - src/preprocessing/validate_data.py
      - data/raw/reddit_reviews.csv
      - data/raw/kaggle_imdb.csv
    outs:
      - data/raw/validated_data.csv
    metrics:
      - data/raw/validation_report.json:
          cache: false

  # Stage 3: Data Preprocessing
  preprocessing:
    cmd: python src/preprocessing/preprocess.py
    deps:
      - src/preprocessing/preprocess.py
      - src/preprocessing/text_cleaner.py
      - data/raw/validated_data.csv
    params:
      - preprocessing
    outs:
      - data/processed/train.csv
      - data/processed/validation.csv
      - data/processed/test.csv
      - data/processed/tfidf_vectorizer.pkl
      - data/processed/label_encoder.pkl
    metrics:
      - data/processed/preprocessing_stats.json:
          cache: false

  # Stage 4: Feature Engineering
  feature_engineering:
    cmd: python src/preprocessing/feature_engineer.py
    deps:
      - src/preprocessing/feature_engineer.py
      - data/processed/train.csv
      - data/processed/validation.csv
      - data/processed/test.csv
    outs:
      - data/processed/train_features.csv
      - data/processed/validation_features.csv
      - data/processed/test_features.csv
    metrics:
      - data/processed/feature_stats.json:
          cache: false

  # Stage 5: Train Traditional ML Models
  train_traditional_ml:
    cmd: python src/models/train_traditional.py
    deps:
      - src/models/train_traditional.py
      - src/models/traditional_ml.py
      - data/processed/train_features.csv
      - data/processed/validation_features.csv
      - data/processed/tfidf_vectorizer.pkl
    params:
      - model.traditional
    outs:
      - models/logistic_regression.pkl
      - models/random_forest.pkl
      - models/svm.pkl
    metrics:
      - metrics/traditional_ml_metrics.json:
          cache: false

  # Stage 6: Train Transformer Model
  train_transformer:
    cmd: python src/models/train_transformer.py
    deps:
      - src/models/train_transformer.py
      - src/models/transformer_model.py
      - data/processed/train.csv
      - data/processed/validation.csv
    params:
      - model.transformer
    outs:
      - models/distilbert_model/
    metrics:
      - metrics/transformer_metrics.json:
          cache: false

  # Stage 7: Model Evaluation
  evaluate_models:
    cmd: python src/models/evaluate_models.py
    deps:
      - src/models/evaluate_models.py
      - src/models/model_evaluator.py
      - data/processed/test.csv
      - data/processed/test_features.csv
      - models/logistic_regression.pkl
      - models/random_forest.pkl
      - models/svm.pkl
      - models/distilbert_model/
    outs:
      - metrics/evaluation_report.json
      - metrics/confusion_matrices/
    metrics:
      - metrics/final_metrics.json:
          cache: false
